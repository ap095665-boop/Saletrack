<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#5b5bd6">
<title>Shop Visit & Sale Tracker</title>
<style>
*{box-sizing:border-box}
:root{--bg:#f5f7fb;--card:#fff;--text:#172033;--muted:#667085;--line:#e4e7ec;--accent:#5b5bd6;--green:#08794f;--orange:#9a5b00;--red:#d92d20}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.app{max-width:760px;margin:auto;padding:15px 13px 90px}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:15px}
h1{font-size:22px;margin:0 0 3px}.sub{font-size:13px;color:var(--muted)}
button,input,select{font:inherit}button{border:0;border-radius:12px;padding:11px 13px;font-weight:750;cursor:pointer}
.primary{background:var(--accent);color:#fff}.secondary{background:#eef0ff;color:#4545a8}.danger{background:#fff0ef;color:var(--red)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:15px;margin-bottom:12px;box-shadow:0 2px 8px #10182808}
.stats{display:flex;gap:7px;margin-bottom:12px}.stat{flex:1;background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px}.stat b{display:block;font-size:18px}.stat span{font-size:11px;color:var(--muted)}
.form{display:grid;gap:10px}.hidden{display:none!important}
.section-title{font-size:12px;font-weight:850;color:#475467;text-transform:uppercase;letter-spacing:.05em}
input,select{width:100%;border:1px solid var(--line);background:#fff;border-radius:11px;padding:12px;outline:none;color:var(--text)}
input:focus,select:focus{border-color:#8585e5;box-shadow:0 0 0 3px #5b5bd614}
.row{display:flex;gap:8px}.row>*{flex:1}
.locbox{background:#f7f8ff;border:1px dashed #aeb3ef;border-radius:13px;padding:11px;font-size:12px;color:#525b77}
.locbox strong{display:block;color:var(--text);font-size:13px;margin-bottom:3px}
.receipt-area{border:1px solid var(--line);border-radius:13px;padding:11px;background:#fafbfc}
.receipt-area label{display:block;font-size:12px;font-weight:750;margin-bottom:7px}
#receiptPreview{display:none;width:100%;max-height:190px;object-fit:contain;border-radius:10px;margin-top:9px;background:#eee}
.receipt-meta{font-size:11px;color:var(--muted);margin-top:5px}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px}.search{grid-column:1/-1}
.shop-head{display:flex;justify-content:space-between;gap:10px}.shop-name{font-weight:850;font-size:17px}
.badge{font-size:10px;font-weight:850;padding:5px 8px;border-radius:999px;white-space:nowrap;height:max-content}
.badge.sale{background:#e8fff5;color:var(--green)}.badge.visit{background:#fff4df;color:var(--orange)}
.meta{color:var(--muted);font-size:12px;line-height:1.55;margin-top:6px}
.sale-info{margin-top:10px;background:#f8fafc;border-radius:12px;padding:11px;font-size:13px}.sale-info b{font-size:14px}
.receipt-thumb{display:block;margin-top:9px;width:145px;height:100px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.actions{display:flex;gap:7px;margin-top:10px}.actions button{padding:8px 10px;font-size:12px}
.empty{text-align:center;padding:28px 14px;color:var(--muted)}
#searchLocation{margin-top:8px}
progress{width:100%;height:7px;display:none}
@media(max-width:520px){.filters{grid-template-columns:1fr}.search{grid-column:auto}.row{flex-direction:column}}
</style>
</head>
<body>
<div class="app">
<header>
  <div><h1>Shop Tracker</h1><div class="sub">Local visit & sale history</div></div>
  <button class="primary" onclick="toggleForm()">＋ Add</button>
</header>

<div class="stats">
  <div class="stat"><b id="totalCount">0</b><span>Total</span></div>
  <div class="stat"><b id="saleCount">0</b><span>Sales</span></div>
  <div class="stat"><b id="visitCount">0</b><span>Visits</span></div>
</div>

<div class="card form hidden" id="formCard">
  <div class="section-title">New record</div>
  <input id="shopName" placeholder="Shop name *" autocomplete="off">

  <select id="status" onchange="statusChanged()">
    <option value="visited">👣 Visited</option>
    <option value="sale">💰 Sale</option>
  </select>

  <div id="saleFields" class="form hidden">
    <input id="product" placeholder="Product name *" autocomplete="off">
    <input id="amount" type="number" min="0" step="0.01" inputmode="decimal" placeholder="Sale amount (₹) *">

    <div class="receipt-area">
      <label>📷 Payment receipt (optional)</label>
      <input id="receipt" type="file" accept="image/*" onchange="handleReceipt(event)">
      <progress id="compressProgress" max="100"></progress>
      <img id="receiptPreview" alt="Optimized payment receipt">
      <div id="receiptMeta" class="receipt-meta"></div>
    </div>
  </div>

  <div class="locbox">
    <strong>📍 Location</strong>
    <span id="locationText">Not captured yet</span>
  </div>

  <div class="row">
    <button class="secondary" type="button" onclick="captureLocation()">📍 Capture location</button>
    <button class="primary" type="button" onclick="saveRecord()">Save record</button>
  </div>
  <button class="danger" type="button" onclick="resetForm()">Cancel</button>
</div>

<div class="card">
  <div class="section-title">Find records</div>
  <div class="filters">
    <input class="search" id="search" placeholder="🔎 Search shop or product…" oninput="render()">
    <select id="typeFilter" onchange="render()">
      <option value="all">All records</option>
      <option value="visited">Visited</option>
      <option value="sale">Sales</option>
    </select>
    <select id="distanceFilter" onchange="render()">
      <option value="all">All locations</option>
      <option value="1">Within 1 km</option>
      <option value="5">Within 5 km</option>
      <option value="10">Within 10 km</option>
      <option value="25">Within 25 km</option>
    </select>
  </div>
  <div class="row" style="margin-top:9px">
    <button class="secondary" onclick="getSearchLocation()">📍 Use my location</button>
    <button class="danger" onclick="clearFilters()">Clear</button>
  </div>
  <div id="searchLocation" class="sub"></div>
</div>

<div id="list"></div>
</div>

<script>
/* =========================
   IndexedDB
   ========================= */
const DB_NAME="ShopTrackerDB", DB_VERSION=1, STORE="records";
let db;
let records=[];
let capturedLocation=null, searchLocation=null, receiptBlob=null, receiptPreviewUrl=null;

function openDB(){
  return new Promise((resolve,reject)=>{
    const req=indexedDB.open(DB_NAME,DB_VERSION);
    req.onupgradeneeded=e=>{
      const d=e.target.result;
      if(!d.objectStoreNames.contains(STORE)){
        const s=d.createObjectStore(STORE,{keyPath:"id"});
        s.createIndex("status","status");
        s.createIndex("shop","shop");
        s.createIndex("createdAt","createdAt");
      }
    };
    req.onsuccess=e=>{db=e.target.result;resolve(db)};
    req.onerror=()=>reject(req.error);
  });
}
function idbAll(){
  return new Promise((resolve,reject)=>{
    const tx=db.transaction(STORE,"readonly"), s=tx.objectStore(STORE), req=s.getAll();
    req.onsuccess=()=>resolve(req.result||[]);req.onerror=()=>reject(req.error);
  });
}
function idbPut(record){
  return new Promise((resolve,reject)=>{
    const tx=db.transaction(STORE,"readwrite");tx.objectStore(STORE).put(record);
    tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);
  });
}
function idbDelete(id){
  return new Promise((resolve,reject)=>{
    const tx=db.transaction(STORE,"readwrite");tx.objectStore(STORE).delete(id);
    tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);
  });
}
async function init(){
  try{
    await openDB();
    records=await idbAll();
    records.sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));
    render();
  }catch(e){
    console.error(e);
    alert("IndexedDB could not be opened in this browser.");
  }
}

/* =========================
   Image compression
   ========================= */
function compressImage(file){
  return new Promise((resolve,reject)=>{
    if(!file.type.startsWith("image/")) return reject(new Error("Please select an image."));
    const img=new Image(), reader=new FileReader();
    reader.onload=()=>{img.src=reader.result};
    reader.onerror=()=>reject(reader.error);
    img.onload=()=>{
      const maxSide=1100;
      const scale=Math.min(1,maxSide/Math.max(img.naturalWidth,img.naturalHeight));
      const w=Math.max(1,Math.round(img.naturalWidth*scale));
      const h=Math.max(1,Math.round(img.naturalHeight*scale));
      const canvas=document.createElement("canvas");canvas.width=w;canvas.height=h;
      const ctx=canvas.getContext("2d",{alpha:false});
      ctx.fillStyle="#fff";ctx.fillRect(0,0,w,h);ctx.drawImage(img,0,0,w,h);
      canvas.toBlob(blob=>{
        if(!blob)return reject(new Error("Compression failed."));
        resolve(blob);
      },"image/jpeg",.68);
    };
    img.onerror=()=>reject(new Error("Could not read image."));
    reader.readAsDataURL(file);
  });
}
async function handleReceipt(e){
  const file=e.target.files?.[0];
  if(!file)return;
  receiptMeta.textContent="Optimizing receipt…";
  compressProgress.style.display="block";compressProgress.value=25;
  try{
    receiptBlob=await compressImage(file);
    compressProgress.value=100;
    if(receiptPreviewUrl)URL.revokeObjectURL(receiptPreviewUrl);
    receiptPreviewUrl=URL.createObjectURL(receiptBlob);
    receiptPreview.src=receiptPreviewUrl;receiptPreview.style.display="block";
    receiptMeta.textContent=`Optimized: ${(file.size/1024).toFixed(0)} KB → ${(receiptBlob.size/1024).toFixed(0)} KB`;
    setTimeout(()=>compressProgress.style.display="none",500);
  }catch(err){
    receiptBlob=null;receiptPreview.style.display="none";
    receiptMeta.textContent=err.message;
    e.target.value="";
  }
}

/* =========================
   Form + GPS
   ========================= */
function toggleForm(){formCard.classList.toggle("hidden")}
function statusChanged(){
  saleFields.classList.toggle("hidden",status.value!=="sale");
}
function captureLocation(){
  if(!navigator.geolocation){alert("Geolocation is not supported.");return}
  locationText.textContent="Capturing high-accuracy GPS…";
  navigator.geolocation.getCurrentPosition(p=>{
    capturedLocation={lat:p.coords.latitude,lon:p.coords.longitude,accuracy:p.coords.accuracy};
    locationText.textContent=`${capturedLocation.lat.toFixed(6)}, ${capturedLocation.lon.toFixed(6)} • ±${Math.round(capturedLocation.accuracy)} m`;
  },e=>{
    locationText.textContent="Location unavailable";
    alert("Location failed: "+e.message+"\n\nAllow location permission and try again.");
  },{enableHighAccuracy:true,timeout:25000,maximumAge:0});
}
async function saveRecord(){
  const name=shopName.value.trim(), type=status.value;
  if(!name){alert("Enter the shop name.");return}
  if(type==="sale"){
    if(!product.value.trim()){alert("Enter the product name.");return}
    if(amount.value==="" || Number(amount.value)<0){alert("Enter the sale amount.");return}
  }
  const record={
    id:(crypto.randomUUID?crypto.randomUUID():Date.now()+"-"+Math.random()),
    shop:name,status:type,
    product:type==="sale"?product.value.trim():"",
    amount:type==="sale"?Number(amount.value):null,
    receipt: type==="sale" && receiptBlob ? receiptBlob : null,
    lat:capturedLocation?.lat??null,
    lon:capturedLocation?.lon??null,
    accuracy:capturedLocation?.accuracy??null,
    createdAt:new Date().toISOString()
  };
  try{
    await idbPut(record);
    records.unshift(record);
    resetForm();
    render();
  }catch(e){
    console.error(e);alert("Could not save the record to IndexedDB.");
  }
}
function resetForm(){
  shopName.value="";product.value="";amount.value="";receipt.value="";
  status.value="visited";statusChanged();
  receiptBlob=null;
  if(receiptPreviewUrl)URL.revokeObjectURL(receiptPreviewUrl);
  receiptPreviewUrl=null;receiptPreview.src="";receiptPreview.style.display="none";receiptMeta.textContent="";
  capturedLocation=null;locationText.textContent="Not captured yet";
  formCard.classList.add("hidden");
}

/* =========================
   Search / nearby
   ========================= */
function getSearchLocation(){
  if(!navigator.geolocation){alert("Geolocation is not supported.");return}
  searchLocation.textContent="Getting your location…";
  navigator.geolocation.getCurrentPosition(p=>{
    searchLocation={lat:p.coords.latitude,lon:p.coords.longitude};
    document.getElementById("searchLocation").textContent=`📍 ${searchLocation.lat.toFixed(5)}, ${searchLocation.lon.toFixed(5)}`;
    render();
  },e=>alert("Could not get your location: "+e.message),{enableHighAccuracy:true,timeout:25000,maximumAge:0});
}
function distanceKm(a,b){
  if(!a||!b||a.lat==null||b.lat==null)return Infinity;
  const R=6371,rad=x=>x*Math.PI/180;
  const dLat=rad(b.lat-a.lat),dLon=rad(b.lon-a.lon);
  const x=Math.sin(dLat/2)**2+Math.cos(rad(a.lat))*Math.cos(rad(b.lat))*Math.sin(dLon/2)**2;
  return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));
}
function clearFilters(){
  search.value="";typeFilter.value="all";distanceFilter.value="all";
  searchLocation=null;document.getElementById("searchLocation").textContent="";render();
}
function formatDate(x){return new Date(x).toLocaleString([], {dateStyle:"medium",timeStyle:"short"})}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}

/* Blob -> object URL for display. */
const objectUrls=new Map();
function receiptUrl(blob,id){
  if(!blob)return "";
  if(!objectUrls.has(id))objectUrls.set(id,URL.createObjectURL(blob));
  return objectUrls.get(id);
}
function render(){
  const q=search.value.trim().toLowerCase(), typ=typeFilter.value, max=distanceFilter.value;
  let arr=records.filter(r=>{
    if(typ!=="all"&&r.status!==typ)return false;
    if(q&&!(`${r.shop} ${r.product||""}`.toLowerCase().includes(q)))return false;
    if(max!=="all"){
      if(!searchLocation)return false;
      if(distanceKm(searchLocation,{lat:r.lat,lon:r.lon})>Number(max))return false;
    }
    return true;
  });
  totalCount.textContent=records.length;
  saleCount.textContent=records.filter(r=>r.status==="sale").length;
  visitCount.textContent=records.filter(r=>r.status==="visited").length;

  if(!arr.length){list.innerHTML='<div class="card empty">No matching records.<br><small>Add a visit or sale to start your history.</small></div>';return}

  list.innerHTML=arr.map(r=>{
    const d=searchLocation&&r.lat!=null?distanceKm(searchLocation,{lat:r.lat,lon:r.lon}):null;
    const receipt=r.receipt instanceof Blob ? `<img class="receipt-thumb" src="${receiptUrl(r.receipt,r.id)}" alt="Payment receipt">` : "";
    return `<div class="card shop">
      <div class="shop-head">
        <div><div class="shop-name">${esc(r.shop)}</div><div class="meta">${formatDate(r.createdAt)}</div></div>
        <span class="badge ${r.status==="sale"?"sale":"visit"}">${r.status==="sale"?"SALE":"VISITED"}</span>
      </div>
      ${r.status==="sale"?`<div class="sale-info">🛒 <b>${esc(r.product)}</b><br>💰 ₹${Number(r.amount).toLocaleString("en-IN",{minimumFractionDigits:2})}</div>`:""}
      <div class="meta">📍 ${r.lat!=null?`${r.lat.toFixed(6)}, ${r.lon.toFixed(6)}${r.accuracy?` • ±${Math.round(r.accuracy)}m`:""}`:"No location captured"}${d!=null&&isFinite(d)?`<br>📏 ${d<1?(d*1000).toFixed(0)+" m":d.toFixed(2)+" km"} away`:""}</div>
      ${receipt}
      <div class="actions">
        ${r.lat!=null?`<button class="secondary" onclick="openMap(${r.lat},${r.lon})">🗺️ Map</button>`:""}
        <button class="danger" onclick="deleteRecord('${r.id}')">Delete</button>
      </div>
    </div>`;
  }).join("");
}
function openMap(lat,lon){window.open(`https://www.google.com/maps/search/?api=1&query=${lat},${lon}`,"_blank")}
async function deleteRecord(id){
  if(!confirm("Delete this record?"))return;
  try{
    await idbDelete(id);
    const u=objectUrls.get(id);if(u){URL.revokeObjectURL(u);objectUrls.delete(id)}
    records=records.filter(r=>r.id!==id);render();
  }catch(e){alert("Could not delete record.")}
}
init();
</script>
</body>
</html>
